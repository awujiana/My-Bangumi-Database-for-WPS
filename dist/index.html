<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>BGM Excel 加载项</title>
  <script type="module" crossorigin src="./assets/main.Ct35KkJQ.js"></script>
</head>
<body>
    <!-- 预加载 DOMPurify UMD（纯静态模式下 TS 模块无法裸 import 'dompurify'，因此在此提前挂到 window.DOMPurify） -->
    <script src="./libs/purify.js"></script>
   
    <script>
        // ========== WPS Ribbon 回调早期占位（模块加载前即需可用）==========
        // WPS 会在模块加载前就调用 OnAddinLoad/OnAction/GetBangumiImage，因此必须提前占位
        var _ribbonReady = false;
        var _pendingActions = [];

        window.OnAddinLoad = function(ribbonUI) {
            console.log('[BGM] OnAddinLoad 早期调用');
            // 缓存 ribbonUI 供后续使用
            if (ribbonUI) {
                window.__ribbonUI = ribbonUI;
            }
            return true;
        };

        window.OnAction = function(control) {
            console.log('[BGM] OnAction 早期调用:', control && control.Id);
            // 如果模块已就绪，直接转发
            if (_ribbonReady && typeof window._OnActionReal === 'function') {
                return window._OnActionReal(control);
            }
            // 否则暂存，等模块加载后重放
            _pendingActions.push(control);
            return true;
        };

        window.GetBangumiImage = function(control) {
            // 如果模块已就绪，使用真实实现
            if (_ribbonReady && typeof window._GetBangumiImageReal === 'function') {
                return window._GetBangumiImageReal(control);
            }
            // 早期占位：返回相对路径（与成功案例一致），WPS 从加载项目录解析。
            // 真实模块加载后通过 _bgmRibbonReady 替换，并由 Invalidate() 刷新。
            var icons = {
                btnShowPanel: 'images/panel.svg',
                btnSyncBangumi: 'images/sync.svg',
                btnSetToken: 'images/token.svg',
                btnTestToken: 'images/key.svg',
                btnCopyToken: 'images/key.svg',
                btnSetUserId: 'images/user.svg',
                btnOpenCollection: 'images/link.svg',
                btnSyncFromGithub: 'images/github.svg',
                btnUndoLastSync: 'images/undo.svg'
            };
            return icons[control && control.Id] || 'images/newFromTemp.svg';
        };

        // 模块就绪后由 ribbon.js 调用此函数完成初始化
        window._bgmRibbonReady = function(realOnAddinLoad, realOnAction, realGetBangumiImage) {
            window._OnAddinLoadReal = realOnAddinLoad;
            window._OnActionReal = realOnAction;
            window._GetBangumiImageReal = realGetBangumiImage;

            // 用真实实现替换占位
            window.OnAddinLoad = realOnAddinLoad;
            window.OnAction = realOnAction;
            window.GetBangumiImage = realGetBangumiImage;

            // 如果之前 OnAddinLoad 已被调用，用真实实现重新执行
            if (window.__ribbonUI && realOnAddinLoad) {
                try { realOnAddinLoad(window.__ribbonUI); } catch(e) { console.error(e); }
            }

            // 重放暂存的 OnAction 调用
            var actions = _pendingActions;
            _pendingActions = [];
            _ribbonReady = true;
            actions.forEach(function(ctrl) {
                try { realOnAction(ctrl); } catch(e) { console.error(e); }
            });

            // 【关键】强制刷新 Ribbon：真实 GetBangumiImage 就位后，
            // WPS 不会自动重新拉取图标，必须显式 Invalidate 让它二次调用
            // getImage 回调，此时才能拿到每个按钮对应的真实 SVG URL。
            // 若只 Invalidate 早期占位返回的默认图标，按钮会一直显示占位图或问号。
            if (window.__ribbonUI && typeof window.__ribbonUI.Invalidate === 'function') {
                try {
                    window.__ribbonUI.Invalidate();
                    console.log('[BGM] Ribbon UI 已 Invalidate，图标将重新加载');
                } catch(e) {
                    console.error('[BGM] Ribbon Invalidate 失败:', e);
                }
            }
        };
        // 调试通知功能：向开发服务器发送请求
        window.onload = function() {
            if (typeof WpsInvoke === "undefined") {
                console.log("调试通知: WpsInvoke 不可用（生产模式）");
                return;
            }

            try {
                var xmlReq = WpsInvoke.CreateXHR();
                var url = location.origin + "/.debugTemp/NotifyDemoUrl";
                xmlReq.open("GET", url);
                xmlReq.onload = function (res) {
                    console.log("调试通知:", res.target.responseText);
                    var node = document.getElementById("DemoSpan");
                    if (node) {
                        node.innerHTML = res.target.responseText;
                    }
                };
                xmlReq.onerror = function () {
                    console.log("调试服务器未连接（生产模式或服务器未启动）");
                };
                xmlReq.send();
            } catch (e) {
                console.log("调试通知功能不可用:", e.message);
            }
        };
          // 新增：Ribbon 真实函数就绪超时检测
            var _ribbonReadyTimeout = setTimeout(function() {
                if (!_ribbonReady) {
                    console.warn('[BGM] Ribbon 模块未在 15 秒内就绪，使用降级模式');
                    // 降级：OnAction 直接显示提示
                    window.OnAction = function(control) {
                        if (typeof BGM !== 'undefined' && BGM.showDialog) {
                            BGM.showDialog('提示', '功能正在加载中，请稍后再试');
                        }
                        return true;
                    };
                    // 清除待处理的 action 队列
                    _pendingActions = [];
                }
            }, 15000);
        
            // 在 _bgmRibbonReady 中清除定时器
            var _originalBgRibbonReady = window._bgmRibbonReady;
            window._bgmRibbonReady = function(realOnAddinLoad, realOnAction,        realGetBangumiImage) {
                clearTimeout(_ribbonReadyTimeout);
                _originalBgRibbonReady(realOnAddinLoad, realOnAction, realGetBangumiImage);
            };



    </script>
    <!-- 调试信息显示区域（可选）-->
    <div id="DemoSpan" style="display:none;"></div>

    <!-- 调试面板（仅开发环境激活，debugPanel.js 内部自动检测 WpsInvoke） -->
</body>
</html>
<!--这个文件是wps加载项的入口文件，wps在启动时加载这个文件-->
