<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1e1e2e" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.bgm.tv https://bangumi.tv https://raw.githubusercontent.com https://api.github.com https://gitlab.com https://gitee.com"
    />
    <!-- 标题是窗口标题：`CreateWebDialog` 只有 url 一个参数、没有 caption，
         宿主拿网页 title 当窗口标题用。改这里等于改窗口标题。 -->
    <title>条件格式规则管理器</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/panel-theme.css" />
    <link rel="stylesheet" href="../css/conditional-format.css" />
  </head>
  <!--
    ===================== 独立窗口版的「条件格式规则管理器」 =====================

    由宿主原生对话框（Application.CreateWebDialog / ShowDialog）加载，是真的独立
    窗口：能拖到 WPS 表格上方、能最大化，不受任务窗格视口限制。

    ## 为什么是「另一个页面」而不是把区块搬过来
    原生对话框是**另一个 WebView**，拿不到任务窗格的 DOM，节点搬不过去
    （任务窗格内的 float 模式才搬 DOM，见 ui/components/detachable-panel.ts）。
    所以这里重新放一份结构，但**逻辑不复制**：页面 JS 仍是
    `conditional-format-page.ts`，元素 id 与任务窗格页完全一致 ——
    那份代码所有取元素的地方都是 `?.` / `if (!x) return`，缺哪个区块就跳过哪个，
    天然只跑「规则管理器」这部分。

    ## data-detachable-page="true" 的作用
    `setupExistingDetachable()` 见到它就不再注册拖出能力 ——
    本页面自己就是被拖出来的窗口，再注册会开出「窗口里的窗口」。
  -->
  <body
    data-page="conditional-format"
    data-detachable-page="true"
    class="conditional-format-dialog"
  >
    <script type="text/javascript" src="../libs/purify.js"></script>
    <script type="module" src="../dist-ts/panel/conditional-format-bootstrap.js"></script>
    <script src="../wpsjsrpcsdk.js"></script>

    <div class="conditional-format-dialog-inner">
      <!-- 目标工作表：与任务窗格页同 id，共用 reloadSheets / 选中逻辑 -->
      <div class="conditional-format-sheet-row">
        <label class="conditional-format-dialog-label" for="conditionalFormatSheet">
          目标工作表
        </label>
        <select id="conditionalFormatSheet" class="conditional-format-select"></select>
        <button type="button" class="bgm-btn small" id="conditionalFormatReloadSheetsBtn">
          🔄 刷新列表
        </button>
        <button type="button" class="bgm-btn small" id="conditionalFormatRefreshExistingBtn">
          🔄 重新读取
        </button>
      </div>

      <!-- 工具条：与 WPS 原生对齐（显示其格式规则 + ↑↓ 调序 + 删除）。
           任务窗格页里它默认 hidden、拖出时才挂进窗口标题栏；这里直接常显。 -->
      <div id="conditionalFormatFloatToolbar" class="conditional-format-float-toolbar">
        <label class="conditional-format-float-field" for="conditionalFormatFloatScope">
          显示其格式规则
          <select id="conditionalFormatFloatScope" class="conditional-format-select">
            <option value="all">整张工作表</option>
            <option value="selection">当前选择</option>
          </select>
        </label>
        <span class="conditional-format-float-spacer"></span>
        <button
          type="button"
          class="bgm-btn small"
          id="conditionalFormatFloatUp"
          disabled
          title="上移所选规则（提高优先级）"
        >
          ↑
        </button>
        <button
          type="button"
          class="bgm-btn small"
          id="conditionalFormatFloatDown"
          disabled
          title="下移所选规则（降低优先级）"
        >
          ↓
        </button>
        <button
          type="button"
          class="bgm-btn small danger"
          id="conditionalFormatFloatDelete"
          disabled
          title="删除所选规则"
        >
          ✕ 删除
        </button>
      </div>

      <div class="conditional-format-toolbar">
        <input
          type="search"
          id="conditionalFormatExistingSearch"
          class="conditional-format-search"
          placeholder="搜索类型 / 范围 / 公式 / 颜色"
        />
        <span class="conditional-format-rule-count" id="conditionalFormatExistingCount">—</span>
      </div>

      <div id="conditionalFormatExistingPanel">
        <div id="conditionalFormatExistingList" class="conditional-format-table"></div>
        <div
          id="conditionalFormatExistingBatchBar"
          class="conditional-format-batch-bar"
          hidden
        ></div>
        <div id="conditionalFormatExistingPager" class="conditional-format-pager"></div>
      </div>

      <!-- 宿主自检失败时的提示：对话框是另一个 WebView，宿主对象注入失败时
           这里会一直空白 —— 用户分不清「表上没规则」和「根本没连上」。 -->
      <p
        class="conditional-format-empty"
        id="conditionalFormatDialogOffline"
        role="alert"
        hidden
      ></p>

      <p class="hint conditional-format-dialog-hint">
        勾选后批量导入 / 删除，单条可上移下移或设「如果为真则停止」。
        非模态窗口：可以直接回表格框选区，再点「重新读取」。关掉本窗口即收回面板。
      </p>
    </div>
  </body>
</html>
