<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<script type="text/javascript" src="../main.js"></script>
<script type="text/javascript" src="../.debugTemp/wpsjsrpcsdk.js"></script>
<body style="background:#1e1e1e;color:#fff;font-family:Consolas,'Courier New',monospace;padding:20px;">
    <h2>同步记录调试页面</h2>
    <button onclick="runTest()">运行测试</button>
    <button onclick="clearLog()">清空日志</button>
    <div id="log" style="margin-top:20px;padding:10px;background:#2d2d2d;border-radius:5px;max-height:400px;overflow-y:auto;"></div>
    
    <script>
        // 重写 console.log 和 console.error
        let logDiv = document.getElementById('log');
        let origLog = console.log;
        let origError = console.error;
        
        function addLog(type, args) {
            let line = document.createElement('div');
            line.style.borderBottom = '1px solid #444';
            line.style.padding = '5px';
            line.style.color = type === 'error' ? '#ff6b6b' : '#69db7c';
            
            let time = new Date().toLocaleTimeString();
            let msg = Array.from(args).map(a => {
                if (typeof a === 'object') {
                    return JSON.stringify(a);
                }
                return String(a);
            }).join(' ');
            
            line.innerHTML = '<span style="color:#888">[' + time + ']</span> ' + msg;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        console.log = function() {
            addLog('log', arguments);
            origLog.apply(console, arguments);
        };
        
        console.error = function() {
            addLog('error', arguments);
            origError.apply(console, arguments);
        };
        
        function clearLog() {
            logDiv.innerHTML = '';
        }
        
        function runTest() {
            console.log('=== 开始测试 ===');
            console.log('getApp:', typeof getApp, getApp ? 'OK' : 'null');
            let app = getApp();
            console.log('ActiveWorkbook:', app && app.ActiveWorkbook ? 'OK' : 'null');
            
            console.log('调用 getOrCreateSyncRecordSheet...');
            let sheet = getOrCreateSyncRecordSheet();
            console.log('返回的工作表:', sheet);
            if (sheet) {
                console.log('工作表名称:', sheet.Name);
            }
            
            // 检查表头
            if (sheet) {
                try {
                    let a1 = sheet.Range('A1');
                    console.log('A1 单元格值:', a1 ? a1.Value2 : 'null');
                } catch(e) {
                    console.error('读取 A1 失败:', e.message);
                }
            }
            
            console.log('=== 测试完成 ===');
        }
    </script>
</body>
</html>
